<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" fill="none" role="img" aria-label="How I approach problems: problem, then requirements, then data, then system, then decision. Understand the operational problem, translate it into measurable requirements, structure and analyse the data, build the dashboard or system, and turn the result into a decision someone can act on."><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect x="100" y="44" width="800" height="1" fill="#30363D"/><text x="100" y="28" fill="#E6EDF3" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">PROBLEM</text><circle cx="100" cy="44.5" r="3.5" fill="#8B949E" opacity="0.55"/><text x="100" y="76" fill="#8B949E" font-size="14" text-anchor="middle">what is actually broken</text><text x="300" y="28" fill="#E6EDF3" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">REQUIREMENTS</text><circle cx="300" cy="44.5" r="3.5" fill="#8B949E" opacity="0.55"/><text x="300" y="76" fill="#8B949E" font-size="14" text-anchor="middle">measurable and agreed</text><text x="500" y="28" fill="#E6EDF3" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">DATA</text><circle cx="500" cy="44.5" r="3.5" fill="#8B949E" opacity="0.55"/><text x="500" y="76" fill="#8B949E" font-size="14" text-anchor="middle">structured and trusted</text><text x="700" y="28" fill="#E6EDF3" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">SYSTEM</text><circle cx="700" cy="44.5" r="3.5" fill="#8B949E" opacity="0.55"/><text x="700" y="76" fill="#8B949E" font-size="14" text-anchor="middle">the dashboard or product</text><text x="900" y="28" fill="#58A6FF" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">DECISION</text><circle cx="900" cy="44.5" r="5" fill="#58A6FF"/><text x="900" y="76" fill="#8B949E" font-size="14" text-anchor="middle">someone can act</text></g></svg>

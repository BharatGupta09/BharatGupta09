<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="166" viewBox="0 0 1000 166" fill="none" role="img" aria-label="Every job requirement resolves to one of three evidence states. Demonstrated: the resume explicitly supports this, evidence quoted. Insufficient: hinted at but not established, evidence quoted. Not demonstrated: not supported by the source at all. The model supplies the states and one bounded signal; a fixed scoring engine produces the number, so the same input gives the same score every time."><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="12" width="10" height="10" rx="2" fill="#3FB950"/><text x="34" y="22" fill="#E6EDF3" font-size="16" font-weight="700" letter-spacing="1.4">DEMONSTRATED</text><rect x="12" y="38" width="268" height="1" fill="#30363D"/><text x="12" y="64" fill="#8B949E" font-size="15">The resume explicitly</text><text x="12" y="88" fill="#8B949E" font-size="15">supports this. Evidence quoted.</text><rect x="352" y="12" width="10" height="10" rx="2" fill="#D29922"/><text x="374" y="22" fill="#E6EDF3" font-size="16" font-weight="700" letter-spacing="1.4">INSUFFICIENT</text><rect x="352" y="38" width="268" height="1" fill="#30363D"/><text x="352" y="64" fill="#8B949E" font-size="15">Hinted at, but not</text><text x="352" y="88" fill="#8B949E" font-size="15">established. Evidence quoted.</text><rect x="692" y="12" width="10" height="10" rx="2" fill="#8B949E"/><text x="714" y="22" fill="#E6EDF3" font-size="16" font-weight="700" letter-spacing="1.4">NOT DEMONSTRATED</text><rect x="692" y="38" width="268" height="1" fill="#30363D"/><text x="692" y="64" fill="#8B949E" font-size="15">Not supported by the</text><text x="692" y="88" fill="#8B949E" font-size="15">source at all.</text><rect x="12" y="124" width="948" height="1" fill="#30363D"/><text x="12" y="150" fill="#6E7681" font-size="14">The model supplies the states and one bounded signal. A fixed engine produces the number.</text></g></svg>
